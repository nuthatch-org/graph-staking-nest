[nest]
name = "graph-staking-nest"
chain = "arbitrum-one"
chain_id = 42161
rpc_urls = [
    "https://arb1.arbitrum.io/rpc",
]
schema_version = 1

[[contracts]]
alias = "staking"
address = "0x00669a4cf01450b64e8a2a20e9b1fcb71e61ef03"
start_block = 42449585
abi = "abis/staking.json"
# RFC-0011 allowlist: this nest exists only to serve Lodestar's delegation-events feed, so keep just
# the four delegation events instead of all 28 HorizonStaking tables. Maps to the subgraph's
# eventType: TokensDelegated->"delegation", TokensUndelegated->"undelegation",
# {DelegatedTokensWithdrawn, StakeDelegatedWithdrawn}->"withdrawal".
events = ["TokensDelegated", "TokensUndelegated", "DelegatedTokensWithdrawn", "StakeDelegatedWithdrawn"]
